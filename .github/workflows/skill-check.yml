name: Skill checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: node --test scripts/check-skill.test.mjs pi/context-compaction.test.mjs
      - run: node scripts/check-skill.mjs
